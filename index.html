<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#00A896">
    <title>Audio Tour San Vicente</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon / Icons -->
    <link rel="icon" type="image/png" href="logos%20PNG/icono%20audio%20tour.png">
    <link rel="apple-touch-icon" href="logos%20PNG/icono%20audio%20tour.png">

    <!-- Fonts: Inter / Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Nav -->
    <header class="app-header">
        <!-- Logo aislado en una esquina superior. Tamaño ultra estricto para móvil. -->
        <div class="logo-box">
            <img src="logos%20PNG/logo%20audio%20tour.png" alt="Logo Audio Tour" class="logo-fixed-mobile">
        </div>
        
        <!-- Píldora Idiomas a la derecha -->
        <div class="header-lang-box glass-pill shadow">
            <div class="lang-pill">
                <button id="btn-es" class="lang-btn active">ES</button>
                <div class="lang-divider"></div>
                <button id="btn-en" class="lang-btn">EN</button>
            </div>
        </div>
    </header>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Location Button overlaying Map -->
    <button id="btn-locate" class="btn-floating-location glass-pill shadow" aria-label="Mi Ubicación">
        <i class="fa-solid fa-location-arrow"></i>
    </button>

    <!-- SmartGuide Minimalist Tourist Card -->
    <div id="audio-panel" class="tourist-card fade-out shadow">
        <button id="btn-close-panel" class="btn-close-card"><i class="fa-solid fa-xmark"></i></button>
        
        <!-- Pestañas de Navegación -->
        <div class="card-tabs">
            <button class="tab-btn active" id="tab-audio-btn">
                <i class="fa-solid fa-headphones"></i> <span id="label-audio-tab">Audio</span>
            </button>
            <button class="tab-btn" id="tab-tips-btn">
                <i class="fa-solid fa-lightbulb"></i> <span id="label-tips-tab">Lugares & Tips</span>
            </button>
        </div>

        <div class="card-content">
            <div class="card-header">
                <h2 id="point-title" class="title">Bienvenida</h2>
                <p id="point-desc" class="subtitle">Descubre San Vicente de Tagua Tagua</p>
            </div>
            
            <!-- CONTENIDO PESTAÑA: AUDIO -->
            <div id="view-audio" class="tab-view active-view">
                <div class="audio-controls-minimal">
                    <audio id="audio-player" style="display:none;"></audio>
                    
                    <button id="btn-play-pause" class="play-btn-main shadow">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    
                    <div class="progress-wrapper">
                        <div class="time-texts">
                            <span id="current-time">0:00</span>
                            <span id="duration-time">0:00</span>
                        </div>
                        <div class="progress-bar-bg" id="progress-container">
                            <div class="progress-bar-fill" id="progress-bar"></div>
                        </div>
                    </div>
                </div>

                <div class="card-footer-actions">
                    <button id="btn-directions" class="btn-action">
                        <i class="fa-solid fa-route"></i> <span id="label-directions">Cómo llegar</span>
                    </button>
                    <a href="https://www.camaraturismosanvicente.cl/audio-tour" target="_blank" class="btn-action sponsor-link">
                        <i class="fa-solid fa-circle-info"></i> <span id="label-info">Cámara Turismo</span>
                    </a>
                </div>
            </div>

            <!-- CONTENIDO PESTAÑA: TIPS / LUGARES -->
            <div id="view-tips" class="tab-view hidden-view">
                <div class="tips-container">
                    <ul id="tips-list" class="tips-list">
                        <!-- Llenado dinámico vía JS -->
                    </ul>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Main JS -->
    <script src="main.js"></script>

    <!-- PWA Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.error('SW Falló', err);
                });
            });
        }
    </script>
</body>
</html>
