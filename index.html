<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#00A896">
    <title>Audio Tour San Vicente</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon / Icons -->
    <link rel="icon" type="image/png" href="logos%20PNG/icono%20audio%20tour.png">
    <link rel="apple-touch-icon" href="logos%20PNG/icono%20audio%20tour.png">

    <!-- Fonts: Inter / Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Nav (Minimalista) -->
    <header class="app-header">
        <div class="header-content glass-pill">
            <img src="logos%20PNG/logo%20audio%20tour.png" alt="Logo Audio Tour" class="logo-small">
            <div class="lang-pill">
                <button id="btn-es" class="lang-btn active">ES</button>
                <div class="lang-divider"></div>
                <button id="btn-en" class="lang-btn">EN</button>
            </div>
        </div>
    </header>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Location Button overlaying Map -->
    <button id="btn-locate" class="btn-floating-location glass-pill shadow" aria-label="Mi Ubicación">
        <i class="fa-solid fa-location-arrow"></i>
    </button>

    <!-- Audio Player Minimalist Card (Hidden by default) -->
    <div id="audio-panel" class="audio-card fade-out">
        <button id="btn-close-panel" class="btn-close-card"><i class="fa-solid fa-xmark"></i></button>
        
        <div class="card-content">
            <div class="card-header">
                <div>
                    <h2 id="point-title" class="title">Bienvenida</h2>
                    <p id="point-desc" class="subtitle">Descubre San Vicente de Tagua Tagua</p>
                </div>
            </div>
            
            <div class="audio-controls-minimal">
                <audio id="audio-player" style="display:none;"></audio>
                
                <button id="btn-play-pause" class="play-btn-main shadow">
                    <i class="fa-solid fa-play"></i>
                </button>
                
                <div class="progress-wrapper">
                    <div class="time-texts">
                        <span id="current-time">0:00</span>
                        <span id="duration-time">0:00</span>
                    </div>
                    <div class="progress-bar-bg" id="progress-container">
                        <div class="progress-bar-fill" id="progress-bar"></div>
                    </div>
                </div>
            </div>

            <div class="card-footer-actions">
                <button id="btn-directions" class="btn-action">
                    <i class="fa-solid fa-route"></i> <span id="label-directions">Cómo llegar</span>
                </button>
                <a href="https://www.camaraturismosanvicente.cl/audio-tour" target="_blank" class="btn-action sponsor-link">
                    <i class="fa-solid fa-circle-info"></i> <span id="label-info">Más Info</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Main JS -->
    <script src="main.js"></script>

    <!-- PWA Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('Service Worker registrado!', reg.scope);
                }).catch(err => {
                    console.error('Service Worker Falló', err);
                });
            });
        }
    </script>
</body>
</html>
